name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # vitest and workerd (tests/workers/) run on Node.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run check

      - name: Test
        run: bun test

      - name: Test on workerd
        run: bun run test:workers
